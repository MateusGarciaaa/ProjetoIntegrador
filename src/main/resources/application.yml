spring:
  application:
    name: churchhub-api

  datasource:
    url: jdbc:postgresql://localhost:5432/churchhub
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate   # nunca "update" - quem manda no schema é o Flyway
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080