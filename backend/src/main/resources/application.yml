# Toda configuração sensível ou que muda por ambiente vem de variável de ambiente (RNF23).
# Em desenvolvimento, as variáveis são lidas do arquivo .env (veja .env.example).
spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: churchhub-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # nunca "update" - quem manda no schema é o Flyway
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# Só o health fica exposto, e sem detalhes. /actuator/health/liveness não consulta o banco:
# é o endereço certo para "acordar" o servidor gratuito sem gastar horas do banco.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  time:
    # Fuso da igreja: "hoje" e "agora" das regras de negócio (ex.: evento encerrado, RN09)
    # vêm do Clock da aplicação neste fuso, não do fuso da máquina (veja ClockConfig).
    zone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    # Sem valor padrão de propósito: um segredo publicado no GitHub permitiria forjar tokens.
    # A aplicação não sobe sem JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
    reset-token-expiration-minutes: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    max-age: 1h
  bootstrap:
    admin-name: ${ADMIN_NAME:Administrador}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    demo-data-enabled: ${DEMO_DATA_ENABLED:false}
    demo-password: ${DEMO_PASSWORD:demo123}
