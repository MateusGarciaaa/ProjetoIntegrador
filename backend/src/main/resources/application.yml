spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: churchhub-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # nunca "update" - quem manda no schema é o Flyway
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# Só o health fica exposto, e sem detalhes. /actuator/health/liveness não consulta o banco:
# é o endereço certo para "acordar" o servidor gratuito sem gastar horas do banco.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  jwt:
    # Sem valor padrão de propósito: um segredo publicado no GitHub permitiria forjar tokens.
    # A aplicação não sobe sem JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
    reset-token-expiration-minutes: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    max-age: 1h